<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="llql-title llql-desc">
  <title id="llql-title">AI quick launch panel in the DSH sidebar</title>
  <desc id="llql-desc">A dark panel titled AI quick launch with a search field and four cards linking to ChatGPT, Claude, Gemini and Doubao.</desc>
  <rect width="640" height="300" fill="#1a1a1e"/>
  <rect x="32" y="20" width="576" height="260" rx="12" fill="#232327" stroke="#3a3a40"/>
  <text x="56" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#f2f2f4">AI quick launch</text>
  <text x="56" y="82" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9a9aa4">One-click access to the AI chat services you use</text>
  <rect x="56" y="100" width="528" height="36" rx="10" fill="#1a1a1e" stroke="#3a3a40"/>
  <text x="72" y="123" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6c6c78">Search services...</text>
  <g>
    <rect x="56" y="156" width="170" height="54" rx="10" fill="#232327" stroke="#3a3a40"/>
    <circle cx="80" cy="183" r="13" fill="#10a37f"/>
    <text x="80" y="188" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">O</text>
    <text x="100" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f2f2f4">ChatGPT</text>
    <text x="100" y="197" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a9aa4">OpenAI</text>
  </g>
  <g>
    <rect x="235" y="156" width="170" height="54" rx="10" fill="#232327" stroke="#3a3a40"/>
    <circle cx="259" cy="183" r="13" fill="#d97757"/>
    <text x="259" y="188" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="279" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f2f2f4">Claude</text>
    <text x="279" y="197" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a9aa4">Anthropic</text>
  </g>
  <g>
    <rect x="414" y="156" width="170" height="54" rx="10" fill="#232327" stroke="#3a3a40"/>
    <circle cx="438" cy="183" r="13" fill="#4285f4"/>
    <text x="438" y="188" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">G</text>
    <text x="458" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f2f2f4">Gemini</text>
    <text x="458" y="197" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a9aa4">Google</text>
  </g>
  <g>
    <rect x="56" y="222" width="170" height="54" rx="10" fill="#232327" stroke="#3a3a40"/>
    <circle cx="80" cy="249" r="13" fill="#00b578"/>
    <text x="80" y="254" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
    <text x="100" y="246" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f2f2f4">Doubao</text>
    <text x="100" y="263" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9a9aa4">ByteDance</text>
  </g>
  <text x="586" y="272" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="transparent" text-anchor="end">space</text>
</svg>
